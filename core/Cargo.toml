[package]
name = "chiffre_aes_core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Coeur cryptographique et format de fichier .enc (chiffrement de fichiers/dossiers)"

[lib]
name = "chiffre_aes_core"
path = "src/lib.rs"

[dependencies]
aes-gcm = "0.11"
argon2 = "0.5"
zeroize = { version = "1.7", features = ["derive"] }
rand = "0.10"
thiserror = "2"
sha2 = "0.11"

flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
zxcvbn = "3"

[dev-dependencies]
# rien pour l'instant, tests unitaires natifs
