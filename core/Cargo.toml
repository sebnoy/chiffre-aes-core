[package]
name = "chiffre_aes_core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Coeur cryptographique et format de fichier .enc (chiffrement de fichiers/dossiers)"

# fuzz/ (harnais cargo-fuzz, corpus, artefacts) est utile au dépôt Git
# (reproductibilité des campagnes de fuzzing) mais n'a aucune valeur pour
# un consommateur de la crate via crates.io — exclu du paquet publié pour
# ne pas l'alourdir inutilement. Distinct de `workspace.exclude` (racine
# du repo), qui ne gère que l'appartenance au workspace, pas le contenu
# du paquet publié.
exclude = ["fuzz/**"]


[lib]
name = "chiffre_aes_core"
path = "src/lib.rs"

[dependencies]
aes-gcm = "0.11"
argon2 = "0.5"
zeroize = { version = "1.7", features = ["derive"] }
rand = "0.10"
thiserror = "2"
sha2 = "0.11"
# Backend pur Rust (miniz_oxide) par défaut, pas de dépendance C dynamique,
# cf. §2.2 du CDC (repli accepté si le binding zstd pur Rust n'est pas
# disponible/fiable pour la compilation croisée statique visée).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
zxcvbn = "3"
tempfile = "3"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
