[package]
name = "chiffre_aes_core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Indique explicitement à Cargo que ce répertoire est sa PROPRE racine de
# résolution, plutôt que de remonter chercher un workspace parent — même
# avec `exclude = ["core/fuzz"]` côté Cargo.toml racine, son absence
# produit une erreur "believes it's in a workspace when it's not" chez
# certaines versions de cargo/cargo-fuzz. Convention standard des projets
# cargo-fuzz (générée automatiquement par `cargo fuzz init`).
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tempfile = "3"
zeroize = "1.7"

[dependencies.chiffre_aes_core]
path = ".."

# cargo-fuzz exige un profil release pour un fuzzing performant, mais avec
# les vérifications de debug activées : c'est précisément ce qui permet de
# détecter les dépassements arithmétiques (`+`, `*` non explicitement
# `checked_*`/`wrapping_*`) qui passeraient inaperçus en release pur.
[profile.release]
debug = 1
debug-assertions = true
overflow-checks = true

[[bin]]
name = "decrypt_file"
path = "fuzz_targets/decrypt_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "extract_archive"
path = "fuzz_targets/extract_archive.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decompress_bytes"
path = "fuzz_targets/decompress_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decrypt_file_with_raw_key"
path = "fuzz_targets/decrypt_file_with_raw_key.rs"
test = false
doc = false
bench = false
